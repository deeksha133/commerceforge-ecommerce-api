services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: change-this-before-production
      DATABASE_URL: sqlite:////data/commerceforge.db
      ADMIN_NAME: Store Admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-this-before-starting
    volumes:
      - commerce-data:/data
volumes:
  commerce-data:
